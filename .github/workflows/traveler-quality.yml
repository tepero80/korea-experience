name: Traveler quality
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traveler-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export-and-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          COMMUNITY_REVIEW_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://koreaexperience.com' || 'https://korea-experience-community-staging.yeomds.workers.dev' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traveler-quality-evidence
          path: |
            test-results/**/*.png
            test-results/**/*.jpg
            test-results/**/error-context.md
            test-results/**/*-info.json
          retention-days: 1
