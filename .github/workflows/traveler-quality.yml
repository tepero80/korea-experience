name: Traveler quality
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traveler-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export-and-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traveler-quality-screens
          path: test-results/**/page.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traveler-quality-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
