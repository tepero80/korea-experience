<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f2f7f4"/>
  <rect width="1200" height="12" fill="#086b66"/>
  <g font-family="Arial, sans-serif" fill="#163632">
    <text x="64" y="90" font-size="22" font-weight="700" fill="#086b66">KOREA EXPERIENCE · CONTACT GUIDE</text>
    <text x="64" y="168" font-size="49" font-weight="700">Tourist help or an emergency?</text>
    <text x="64" y="214" font-size="26">Choose the right service. Have your current location ready.</text>
    <rect x="64" y="270" width="500" height="294" rx="20" fill="#fff" stroke="#cadcd5"/>
    <text x="96" y="350" font-size="64" font-weight="700" fill="#086b66">1330</text>
    <text x="96" y="406" font-size="30" font-weight="700">Tourist information</text>
    <text x="96" y="448" font-size="26">Interpretation · Travel questions</text>
    <text x="96" y="514" font-size="23">Check current call and chat options.</text>
    <rect x="596" y="270" width="540" height="294" rx="20" fill="#163632"/>
    <g fill="#fff">
      <text x="628" y="340" font-size="28" font-weight="700">Emergency assistance</text>
      <text x="628" y="412" font-size="48" font-weight="700">112</text>
      <text x="750" y="408" font-size="27">Police</text>
      <text x="628" y="490" font-size="48" font-weight="700">119</text>
      <text x="750" y="486" font-size="27">Ambulance / fire</text>
    </g>
    <text x="64" y="630" font-size="26" font-weight="700">For immediate danger, do not wait for tourist chat or a community reply.</text>
    <text x="64" y="675" font-size="21" fill="#546c68">Editorial illustration · See the guide for official KTO sources and calling conditions.</text>
  </g>
</svg>
