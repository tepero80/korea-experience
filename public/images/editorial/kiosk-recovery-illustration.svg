<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="853" viewBox="0 0 1280 853">
<rect width="1280" height="853" fill="#eef3eb"/><circle cx="1140" cy="80" r="210" fill="#d9eae1"/><circle cx="80" cy="820" r="180" fill="#f7e4bc"/><rect x="76" y="75" width="1128" height="703" rx="38" fill="#fff"/>
<g font-family="Arial,sans-serif"><text x="130" y="150" font-size="27" font-weight="700" fill="#086b66" letter-spacing="2">PAYMENT BACKUP PLAN</text><text x="130" y="218" font-size="45" font-weight="700" fill="#163632">When a kiosk says no</text><text x="130" y="263" font-size="23" fill="#526965">Illustrative steps · acceptance varies by merchant and issuer</text></g>
<g font-family="Arial,sans-serif" fill="#163632"><rect x="130" y="310" width="1020" height="95" rx="19" fill="#e9f4ee"/><circle cx="179" cy="358" r="25" fill="#086b66"/><text x="179" y="366" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1</text><text x="224" y="367" font-size="28" font-weight="700">Check whether the order went through</text><rect x="130" y="427" width="1020" height="95" rx="19" fill="#e9f4ee"/><circle cx="179" cy="475" r="25" fill="#086b66"/><text x="179" y="483" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2</text><text x="224" y="484" font-size="28" font-weight="700">Ask staff or try an available backup</text><rect x="130" y="544" width="1020" height="95" rx="19" fill="#fbefd5"/><circle cx="179" cy="592" r="25" fill="#b05a25"/><text x="179" y="600" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3</text><text x="224" y="601" font-size="28" font-weight="700">Contact your card issuer if needed</text><text x="130" y="709" font-size="21" fill="#526965">Never share your PIN or full card details in a photo.</text></g></svg>