<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="853" viewBox="0 0 1280 853"><rect width="1280" height="853" fill="#f5eee5"/><circle cx="1120" cy="100" r="230" fill="#dae8dd"/><g font-family="Arial,sans-serif" fill="#264b43"><text x="80" y="100" font-size="27" font-weight="700" letter-spacing="2">FAMILY TRAVEL IN KOREA</text><text x="80" y="180" font-size="48" font-weight="700">When a child needs care</text><rect x="80" y="250" width="340" height="305" rx="30" fill="#fff"/><rect x="470" y="250" width="340" height="305" rx="30" fill="#fff"/><rect x="860" y="250" width="340" height="305" rx="30" fill="#fff"/><text x="110" y="320" font-size="22" font-weight="700">URGENT HELP</text><text x="110" y="414" font-size="80" font-weight="700">119</text><text x="110" y="483" font-size="24">Share your location</text><text x="500" y="320" font-size="22" font-weight="700">FIND A FACILITY</text><text x="500" y="406" font-size="42" font-weight="700">E-Gen</text><text x="500" y="475" font-size="24">Check the listing</text><text x="890" y="320" font-size="22" font-weight="700">BEFORE YOU GO</text><text x="890" y="406" font-size="42" font-weight="700">Call ahead</text><text x="890" y="475" font-size="24">Confirm age and hours</text><text x="80" y="650" font-size="25">For emergencies, contact 119 without delay.</text><text x="80" y="700" font-size="22">This illustration is a travel planning aid, not medical advice.</text></g></svg>