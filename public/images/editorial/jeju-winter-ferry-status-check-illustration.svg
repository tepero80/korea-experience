<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Jeju winter ferry check sequence</title>
  <desc id="desc">An original illustrative route diagram: check the exact port and route, verify the operator’s current sailing status, then confirm the return or choose a fallback. It is not a real map or live ferry status.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8f0ef"/><stop offset="1" stop-color="#a7d9dc"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8efda"/><stop offset="1" stop-color="#e8d6af"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#183c48" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="800" rx="42" fill="#f4f7f4"/>
  <path d="M0 270c180-54 268 38 442-5s278-84 420-31 221 31 338-3v569H0z" fill="url(#sea)"/>
  <path d="M0 0h1200v185c-126 58-244 36-369-1s-269-42-407-5-277 41-424-5z" fill="#fffdf8"/>
  <text x="74" y="88" fill="#183c48" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">JEJU · WINTER FERRY PLAN</text>
  <text x="74" y="145" fill="#17343d" font-family="Arial, sans-serif" font-size="40" font-weight="700">Check the sailing twice</text>
  <g filter="url(#shadow)">
    <rect x="74" y="235" width="300" height="390" rx="28" fill="#fff"/>
    <rect x="450" y="235" width="300" height="390" rx="28" fill="#fff"/>
    <rect x="826" y="235" width="300" height="390" rx="28" fill="#fff"/>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="126" cy="294" r="28" fill="#e99d57"/><text x="118" y="303" fill="#fff" font-size="24" font-weight="700">1</text>
    <text x="112" y="367" fill="#183c48" font-size="25" font-weight="700">Match your route</text>
    <text x="112" y="409" fill="#526970" font-size="18">Port · direction · date</text>
    <path d="M111 478h214" stroke="#d8e5e1" stroke-width="2"/>
    <path d="M138 530h139" stroke="#46828a" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 12"/>
    <circle cx="138" cy="530" r="12" fill="#e99d57"/><circle cx="277" cy="530" r="12" fill="#46828a"/>
    <text x="112" y="581" fill="#526970" font-size="16">A destination name alone</text><text x="112" y="605" fill="#526970" font-size="16">is not a sailing confirmation.</text>

    <circle cx="502" cy="294" r="28" fill="#46828a"/><text x="494" y="303" fill="#fff" font-size="24" font-weight="700">2</text>
    <text x="488" y="367" fill="#183c48" font-size="25" font-weight="700">Verify with the operator</text>
    <text x="488" y="409" fill="#526970" font-size="18">Forecast ≠ final status</text>
    <path d="M488 478h214" stroke="#d8e5e1" stroke-width="2"/>
    <rect x="488" y="510" width="214" height="74" rx="16" fill="#eaf4f2"/>
    <circle cx="520" cy="547" r="11" fill="#e99d57"/><path d="M546 538h130M546 556h94" stroke="#6a8588" stroke-width="7" stroke-linecap="round"/>
    <text x="488" y="605" fill="#526970" font-size="16">Recheck on the travel day.</text>

    <circle cx="878" cy="294" r="28" fill="#183c48"/><text x="870" y="303" fill="#fff" font-size="24" font-weight="700">3</text>
    <text x="864" y="367" fill="#183c48" font-size="25" font-weight="700">Protect the return</text>
    <text x="864" y="409" fill="#526970" font-size="18">Keep a separate fallback</text>
    <path d="M864 478h214" stroke="#d8e5e1" stroke-width="2"/>
    <path d="M891 555c34-45 63-45 97 0s64 45 92 0" fill="none" stroke="#46828a" stroke-width="5" stroke-linecap="round"/>
    <path d="M891 580h189" stroke="#e99d57" stroke-width="4" stroke-dasharray="8 10" stroke-linecap="round"/>
    <text x="864" y="605" fill="#526970" font-size="16">Don’t build a tight connection</text>
  </g>
  <text x="74" y="714" fill="#61777a" font-family="Arial, sans-serif" font-size="17">Illustrative decision aid · Not a map, timetable or live sailing display</text>
</svg>
