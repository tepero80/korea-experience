<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f0ece5"/><g font-family="Arial" fill="#173f3c"><text x="75" y="115" font-size="37" font-weight="bold">BEFORE YOU PACK</text><text x="75" y="175" font-size="25">Check every destination, transit point and airline.</text></g><g font-family="Arial"><circle cx="155" cy="295" r="58" fill="#1c5d55"/><circle cx="155" cy="455" r="58" fill="#1c5d55"/><circle cx="155" cy="615" r="58" fill="#1c5d55"/><text x="143" y="305" font-size="32" fill="white">1</text><text x="143" y="465" font-size="32" fill="white">2</text><text x="143" y="625" font-size="32" fill="white">3</text><g fill="#173f3c"><text x="255" y="285" font-size="29" font-weight="bold">DEVICE + BATTERIES</text><text x="255" y="325" font-size="23">Check airline conditions; do not check the device.</text><text x="255" y="445" font-size="29" font-weight="bold">REFILL LIQUID</text><text x="255" y="485" font-size="23">Check liquid screening and local rules separately.</text><text x="255" y="605" font-size="29" font-weight="bold">AT THE GATE</text><text x="255" y="645" font-size="23">If your bag is checked, ask crew what to remove.</text></g></g></svg>