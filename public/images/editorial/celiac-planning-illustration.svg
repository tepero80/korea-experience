<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="853" viewBox="0 0 1280 853"><rect width="1280" height="853" fill="#f6f1e6"/><path d="M0 730Q350 600 670 710T1280 680V853H0Z" fill="#ead9b8"/><g font-family="Arial,sans-serif"><text x="90" y="105" fill="#316158" font-size="25" font-weight="700" letter-spacing="2">DINING WITH CELIAC DISEASE</text><text x="90" y="178" fill="#173a33" font-size="45" font-weight="700">Plan questions and a backup</text><text x="90" y="224" fill="#516b62" font-size="24">Illustrative checklist · no meal or kitchen is certified here</text><rect x="90" y="285" width="1100" height="100" rx="18" fill="#fff"/><text x="125" y="346" fill="#173a33" font-size="30" font-weight="700">1   Ask about ingredients, sauces and seasonings</text><rect x="90" y="405" width="1100" height="100" rx="18" fill="#fff"/><text x="125" y="466" fill="#173a33" font-size="30" font-weight="700">2   Ask about shared cookware and preparation</text><rect x="90" y="525" width="1100" height="100" rx="18" fill="#fff"/><text x="125" y="586" fill="#173a33" font-size="30" font-weight="700">3   If answers are unclear, use your backup plan</text><text x="90" y="715" fill="#516b62" font-size="23">Use your clinician’s guidance and a reviewed translation.</text></g></svg>