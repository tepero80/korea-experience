<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="853" viewBox="0 0 1280 853"><rect width="1280" height="853" fill="#e8f1ed"/><circle cx="1130" cy="125" r="190" fill="#f5e6c9"/><g font-family="Arial,sans-serif" fill="#173a33"><text x="82" y="110" font-size="25" font-weight="700" letter-spacing="2">FIND A RESTROOM</text><text x="82" y="180" font-size="44" font-weight="700">Look, ask and check access</text><text x="82" y="226" font-size="23">Illustrative steps · facilities and opening hours vary</text><rect x="82" y="290" width="340" height="235" rx="25" fill="#fff"/><text x="112" y="357" font-size="30" font-weight="700">1. Look</text><text x="112" y="406" font-size="23">Check signs or map</text><rect x="470" y="290" width="340" height="235" rx="25" fill="#fff"/><text x="500" y="357" font-size="30" font-weight="700">2. Ask</text><text x="500" y="406" font-size="23">Ask station or venue staff</text><rect x="858" y="290" width="340" height="235" rx="25" fill="#fff"/><text x="888" y="357" font-size="30" font-weight="700">3. Check</text><text x="888" y="406" font-size="23">Gate, hours and access</text><text x="82" y="635" font-size="26" font-weight="700">A listed place is not a guarantee of access or accessibility.</text><text x="82" y="685" font-size="22" fill="#526965">The article provides the Korean word and official Seoul resources.</text></g></svg>