<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Check personal medicines before flying to Korea</title>
  <desc id="desc">An original illustration showing labeled medicine packaging, a prescription document, and a customs checkpoint with a highlighted controlled-medicine review step.</desc>
  <rect width="1200" height="800" rx="36" fill="#f7f2ed"/>
  <rect x="70" y="70" width="1060" height="660" rx="32" fill="#fff" stroke="#e4ddd4" stroke-width="4"/>
  <text x="126" y="150" fill="#553b2c" font-family="Arial,sans-serif" font-size="30" font-weight="700">CHECK BEFORE YOU PACK PERSONAL MEDICINE</text>
  <rect x="137" y="221" width="257" height="308" rx="20" fill="#eff5ef"/>
  <rect x="194" y="285" width="143" height="167" rx="14" fill="#fff" stroke="#5d9478" stroke-width="5"/>
  <rect x="211" y="306" width="109" height="26" rx="5" fill="#79ab8f"/>
  <path d="M218 359h95M218 382h75M218 406h84" stroke="#93a9a0" stroke-width="9" stroke-linecap="round"/>
  <text x="152" y="490" fill="#3d5c4e" font-family="Arial,sans-serif" font-size="19">Keep the label readable</text>
  <rect x="472" y="221" width="257" height="308" rx="20" fill="#edf2f8"/>
  <rect x="528" y="267" width="147" height="194" rx="8" fill="#fff" stroke="#7793b4" stroke-width="5"/>
  <path d="M550 304h102M550 332h102M550 360h77M550 407h60" stroke="#9aacc0" stroke-width="9" stroke-linecap="round"/>
  <text x="496" y="490" fill="#435770" font-family="Arial,sans-serif" font-size="19">Carry prescription details</text>
  <rect x="807" y="221" width="257" height="308" rx="20" fill="#fff0e8"/>
  <path d="M934 274v95m-48-48h96" stroke="#b55742" stroke-width="18" stroke-linecap="round"/>
  <circle cx="934" cy="322" r="86" fill="none" stroke="#b55742" stroke-width="9"/>
  <text x="837" y="490" fill="#763e31" font-family="Arial,sans-serif" font-size="19">Check controlled ingredients</text>
  <rect x="137" y="584" width="927" height="82" rx="20" fill="#f7e7d4"/>
  <text x="171" y="621" fill="#573e2e" font-family="Arial,sans-serif" font-size="20" font-weight="700">Rules changed on 12 Nov 2026. Verify your medicine and quantity first.</text>
  <text x="171" y="650" fill="#654b39" font-family="Arial,sans-serif" font-size="17">Narcotic ingredients can require a separate MFDS permit.</text>
</svg>
