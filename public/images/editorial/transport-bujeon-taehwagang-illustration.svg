<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#eef1e9"/><g font-family="Arial" fill="#123f3d"><text x="80" y="125" font-size="38" font-weight="bold">BUJEON TO TAEHWAGANG</text><text x="80" y="180" font-size="25">Choose your train and check the return.</text></g><rect x="80" y="245" width="1040" height="130" rx="20" fill="#1b5c55"/><rect x="80" y="415" width="1040" height="130" rx="20" fill="#dba750"/><g font-family="Arial"><text x="120" y="300" font-size="30" fill="#fff" font-weight="bold">KTX-EUM</text><text x="120" y="345" font-size="25" fill="#fff">Search and buy the selected train ticket</text><text x="120" y="470" font-size="30" fill="#123f3d" font-weight="bold">DONGHAE METROPOLITAN RAIL</text><text x="120" y="515" font-size="25" fill="#123f3d">Check accepted card or single-journey ticket</text><text x="80" y="650" font-size="25" fill="#123f3d">Taehwagang and Ulsan Station are different stations.</text><text x="80" y="700" font-size="23" fill="#123f3d">Confirm current departures, fare and onward route.</text></g></svg>