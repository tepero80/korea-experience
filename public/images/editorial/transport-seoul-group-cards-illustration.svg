<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#e8f1e8"/><text x="80" y="115" font-family="Arial" font-size="40" font-weight="700" fill="#164c49">SEOUL: CHOOSE HOW TO PAY</text><rect x="75" y="155" width="1050" height="245" rx="28" fill="#fff"/><text x="115" y="220" font-family="Arial" font-size="29" font-weight="700" fill="#174c48">MIXING SUBWAY AND BUS?</text><g fill="#d99336"><circle cx="170" cy="280" r="24"/><circle cx="250" cy="280" r="24"/><circle cx="330" cy="280" r="24"/></g><g fill="#1a5c53"><rect x="147" y="315" width="46" height="55" rx="8"/><rect x="227" y="315" width="46" height="55" rx="8"/><rect x="307" y="315" width="46" height="55" rx="8"/></g><text x="440" y="310" font-family="Arial" font-size="36" font-weight="700" fill="#174c48">ONE COMPATIBLE CARD EACH</text><text x="440" y="355" font-family="Arial" font-size="25" fill="#34564f">Normal transfer conditions still apply.</text><rect x="75" y="430" width="1050" height="250" rx="28" fill="#184e49"/><text x="115" y="495" font-family="Arial" font-size="29" font-weight="700" fill="#fff">PAYING FOR A GROUP ON A BUS?</text><text x="115" y="565" font-family="Arial" font-size="32" fill="#fff">Tell each driver before tapping.</text><text x="115" y="620" font-family="Arial" font-size="27" fill="#fff">No group-payment transfer discount to subway.</text></svg>