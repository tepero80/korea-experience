<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Find a baby care room at Incheon Airport</title>
  <desc id="desc">An original schematic showing the first decision as Terminal 1 or Terminal 2, followed by the airport area: general area, departure side or transfer lounge. Not an airport map.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f3f7f8"/><stop offset="1" stop-color="#e6edf3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#153341" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="800" rx="40" fill="url(#bg)"/>
  <circle cx="1080" cy="112" r="130" fill="#d8e8ed" opacity=".85"/>
  <path d="M0 650c166-91 329 65 493-5 163-70 323-81 478-12 92 41 166 39 229 11v156H0z" fill="#dfe9e9"/>
  <text x="86" y="112" fill="#496a75" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3">INCHEON AIRPORT · FAMILY TRAVEL</text>
  <text x="86" y="177" fill="#172e38" font-family="Arial, sans-serif" font-size="51" font-weight="700">Start with your terminal</text>
  <text x="86" y="221" fill="#516b75" font-family="Arial, sans-serif" font-size="24">Then check which side of security you can reach</text>
  <g filter="url(#shadow)">
    <rect x="86" y="272" width="488" height="237" rx="25" fill="#fff"/>
    <rect x="626" y="272" width="488" height="237" rx="25" fill="#fff"/>
  </g>
  <rect x="122" y="306" width="115" height="43" rx="21" fill="#d9eef0"/>
  <text x="151" y="335" fill="#17596a" font-family="Arial, sans-serif" font-size="19" font-weight="700">T1</text>
  <text x="122" y="398" fill="#1b3540" font-family="Arial, sans-serif" font-size="27" font-weight="700">Terminal 1</text>
  <text x="122" y="440" fill="#516b75" font-family="Arial, sans-serif" font-size="20">Arrivals B/E · check-in D/K</text>
  <text x="122" y="473" fill="#516b75" font-family="Arial, sans-serif" font-size="20">Gates 11, 22, 25, 29, 33, 45</text>
  <rect x="662" y="306" width="115" height="43" rx="21" fill="#e5e3f2"/>
  <text x="691" y="335" fill="#514d81" font-family="Arial, sans-serif" font-size="19" font-weight="700">T2</text>
  <text x="662" y="398" fill="#1b3540" font-family="Arial, sans-serif" font-size="27" font-weight="700">Terminal 2</text>
  <text x="662" y="440" fill="#516b75" font-family="Arial, sans-serif" font-size="20">Arrivals A/B · Bus Stop 1</text>
  <text x="662" y="473" fill="#516b75" font-family="Arial, sans-serif" font-size="20">Family lounges · gates 221, 278</text>
  <path d="M330 544v31h540v-31" fill="none" stroke="#83a8ad" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="600" cy="575" r="11" fill="#548a88"/>
  <g filter="url(#shadow)">
    <rect x="86" y="604" width="316" height="90" rx="20" fill="#fff"/>
    <rect x="442" y="604" width="316" height="90" rx="20" fill="#fff"/>
    <rect x="798" y="604" width="316" height="90" rx="20" fill="#fff"/>
  </g>
  <circle cx="127" cy="648" r="14" fill="#5e9b83"/>
  <text x="157" y="645" fill="#203d43" font-family="Arial, sans-serif" font-size="20" font-weight="700">General area</text>
  <text x="157" y="672" fill="#667b7e" font-family="Arial, sans-serif" font-size="16">Arrivals / check-in</text>
  <circle cx="483" cy="648" r="14" fill="#dc9b68"/>
  <text x="513" y="645" fill="#203d43" font-family="Arial, sans-serif" font-size="20" font-weight="700">Departure side</text>
  <text x="513" y="672" fill="#667b7e" font-family="Arial, sans-serif" font-size="16">After security · gate map</text>
  <circle cx="839" cy="648" r="14" fill="#7b79a7"/>
  <text x="869" y="645" fill="#203d43" font-family="Arial, sans-serif" font-size="20" font-weight="700">Transfer lounge</text>
  <text x="869" y="672" fill="#667b7e" font-family="Arial, sans-serif" font-size="16">Follow your connection</text>
  <text x="87" y="747" fill="#5a7178" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">SCHEMATIC ONLY · USE THE AIRPORT'S LIVE FACILITY MAP</text>
</svg>
