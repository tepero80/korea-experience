  <rect x="445" y="429" width="650" height="188" rx="24" fill="#fff4e8" stroke="#f0d9bd" stroke-width="2"/>
  <circle cx="510" cy="502" r="33" fill="#e18555"/>
  <path d="M495 502l11 11 21-25" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="565" y="493" fill="#583c2b" font-family="Arial,sans-serif" font-size="23" font-weight="700">CHECK THE CURRENT NOTICE</text>
  <text x="565" y="531" fill="#735a48" font-family="Arial,sans-serif" font-size="18">Dates, hours, access, rink operation and weather changes</text>
  <text x="565" y="563" fill="#735a48" font-family="Arial,sans-serif" font-size="18">can differ by venue and visit date.</text>
  <text x="100" y="688" fill="#718896" font-family="Arial,sans-serif" font-size="15">Illustrative planning graphic · not a map, route, live schedule or official event artwork</text>
