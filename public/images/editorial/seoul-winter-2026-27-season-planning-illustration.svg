<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Planning a winter visit to Seoul</title>
  <desc id="desc">An editorial planning board connects a calendar, city event areas and a reminder to check current schedules. It is not a map.</desc>
  <rect width="1200" height="800" fill="#eef5f8"/>
  <rect x="54" y="50" width="1092" height="700" rx="34" fill="#fff" stroke="#d4e1e8" stroke-width="3"/>
  <text x="100" y="127" fill="#16344a" font-family="Arial,sans-serif" font-size="34" font-weight="700">SEOUL · WINTER 2026–27</text>
  <text x="100" y="169" fill="#526b7b" font-family="Arial,sans-serif" font-size="20">A seasonal plan — confirm each venue before you go</text>
  <rect x="100" y="213" width="298" height="404" rx="24" fill="#f4f8fb" stroke="#cfdee8" stroke-width="2"/>
  <rect x="100" y="213" width="298" height="74" rx="24" fill="#1d5e86"/>
  <path d="M100 263h298v24H100z" fill="#1d5e86"/>
  <text x="133" y="261" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">DATE WINDOW</text>
  <text x="134" y="347" fill="#18394f" font-family="Arial,sans-serif" font-size="21" font-weight="700">DEC 04, 2026</text>
  <path d="M138 376h210" stroke="#8fb3c8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="145" cy="376" r="10" fill="#e18555"/><circle cx="341" cy="376" r="10" fill="#e18555"/>
  <text x="134" y="429" fill="#18394f" font-family="Arial,sans-serif" font-size="21" font-weight="700">JAN 31, 2027</text>
  <text x="134" y="486" fill="#526b7b" font-family="Arial,sans-serif" font-size="17">Festival period announced</text>
  <text x="134" y="516" fill="#526b7b" font-family="Arial,sans-serif" font-size="17">by Seoul Metropolitan Government</text>
  <rect x="445" y="213" width="650" height="188" rx="24" fill="#e8f4f7"/>
  <text x="482" y="261" fill="#16344a" font-family="Arial,sans-serif" font-size="22" font-weight="700">ANNOUNCED CITY AREAS</text>
  <g font-family="Arial,sans-serif" font-size="18" fill="#23475c">
