    <rect x="664" y="290" width="176" height="42" rx="21" fill="#fff"/><text x="685" y="317">Cheonggyecheon</text>
    <rect x="854" y="290" width="120" height="42" rx="21" fill="#fff"/><text x="879" y="317">Seoul Plaza</text>
    <rect x="480" y="346" width="110" height="42" rx="21" fill="#fff"/><text x="516" y="373">DDP</text>
    <rect x="604" y="346" width="190" height="42" rx="21" fill="#fff"/><text x="629" y="373">Hangang River</text>
    <rect x="808" y="346" width="240" height="42" rx="21" fill="#fff"/><text x="834" y="373">Bosingak Pavilion</text>
